site_name: Smart Attendance
site_description: Smart Attendance setup guide and developer manual
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/book-open-page-variant

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list

nav:
  - Home: index.md
  - Setup Guide:
      - Overview: setup/index.md
      - Prerequisites: setup/prerequisites.md
      - Project Structure: setup/project-structure.md
      - Database Setup: setup/database.md
      - Backend Setup: setup/backend.md
      - Frontend Setup: setup/frontend.md
      - Mobile Setup: setup/mobile.md
      - Face Recognition Model Setup: setup/face-model.md
      - Service Ports Reference: setup/service-ports.md
      - Troubleshooting: setup/troubleshooting.md
  - Developer Manual:
      - Overview: manual/index.md
      - Project Overview and Architecture: manual/overview-architecture.md
      - Technology Stack and Folder Structure: manual/technology-stack-and-folder-structure.md
      - Database Design: manual/database-design.md
      - API Documentation: manual/api-documentation.md
      - Authentication, Security, and Core Modules: manual/auth-security-core-modules.md
      - Face Recognition Module: manual/ml-face-recognition.md
      - References: manual/references.md
